[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnom-hub"
version = "1.8.0"
description = "Gnom-Hub v1 – Local multi-agent hub: brainstorm first, then execute workers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Private Use" }
authors = [
  { name = "Daniel" }
]
keywords = ["multi-agent", "llm", "local-ai", "fastapi", "gnom-hub"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
# Pinned for stable CI (ruff rulesets drift between minors)
dev = [
  "ruff==0.16.1",
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
  "httpx>=0.27,<1",
]

[project.scripts]
gnom-hub = "gnom_hub.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnom_hub = ["ui/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# smoke scripts put sys.path before imports — not library code
extend-exclude = [".venv", "venv", "data", "dist", "build"]

[tool.ruff.lint]
# Keep CI stable across ruff minors; bandit noise on intentional soft-fail is noisy
ignore = ["S110"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
