[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnom-hub"
version = "3.7.1"
description = "Gnom-Hub v1 – Local multi-agent hub: brainstorm first, then execute workers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Private Use" }
authors = [
  { name = "Daniel" }
]
keywords = ["multi-agent", "llm", "local-ai", "fastapi", "gnom-hub"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
# Pinned for stable CI (ruff rulesets drift between minors)
dev = [
  "ruff==0.16.1",
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
  "httpx>=0.27,<1",
  "mutmut==2.4.5",
]
# Computer-use / desktop automation (God-Mode). System: tesseract binary optional.
computer = [
  "pyautogui>=0.9.54",
  "Pillow>=10.0",
  "mss>=9.0",
  "pytesseract>=0.3.10",
  "pynput>=1.7.6",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "playwright>=1.40",
]

[project.scripts]
gnom-hub = "gnom_hub.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnom_hub = ["ui/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# smoke scripts put sys.path before imports — not library code
extend-exclude = [".venv", "venv", "data", "dist", "build"]

[tool.ruff.lint]
# Keep CI stable across ruff minors; bandit noise on intentional soft-fail is noisy
ignore = ["S110"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "BLE001", "EXE001", "S104", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.mutmut]
# Pure Flex/clarify helpers only — high signal, low noise.
# For full-tree exploration, override:
#   mutmut run --paths-to-mutate=src/gnom_hub/
paths_to_mutate = "src/gnom_hub/agents/roles_helpers.py"

# Must include PYTHONPATH=src (src-layout package).
# Focused suites that kill Flex-wish / clarify / warm contracts.
# --assert=plain is required by mutmut's pytest integration.
runner = "env PYTHONPATH=src python -m pytest -x -q --tb=line --assert=plain tests/test_flex_wish_filter.py tests/test_needs_clarify.py tests/test_flex_pipeline.py tests/test_warm.py tests/test_warm_trim.py"

tests_dir = "tests/"

# Slightly more headroom than default (slow CI / first import).
test_time_multiplier = 2.0
test_time_base = 0.5

# Skip decorator mutations (noise on helpers with none / rare).
disable_mutation_types = "decorator"

# CI-friendly progress when run via scripts/run_mutmut.sh --CI
simple_output = true
no_progress = true
