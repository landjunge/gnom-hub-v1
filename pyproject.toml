[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnom-hub"
version = "3.10.1"
description = "Gnom-Hub v1 – Local multi-agent hub: brainstorm first, then execute workers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Private Use" }
authors = [
  { name = "Daniel" }
]
keywords = ["multi-agent", "llm", "local-ai", "fastapi", "gnom-hub"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
# Pinned for stable CI (ruff rulesets drift between minors)
dev = [
  "ruff==0.16.1",
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
  "httpx>=0.27,<1",
  "mutmut==2.4.5",
]
# Computer-use / desktop automation (God-Mode). System: tesseract binary optional.
computer = [
  "pyautogui>=0.9.54",
  "Pillow>=10.0",
  "mss>=9.0",
  "pytesseract>=0.3.10",
  "pynput>=1.7.6",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "playwright>=1.40",
]
# Optional neural vector backends (never required for default bow path)
embeddings = [
  "fastembed>=0.4.0",
]

[project.scripts]
gnom-hub = "gnom_hub.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnom_hub = ["ui/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# smoke scripts put sys.path before imports — not library code
extend-exclude = [
  ".venv",
  "venv",
  "data",
  "dist",
  "build",
  "*.md",
  "docs",
  "site",
  ".ruff_cache",
  ".pytest_cache",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.ruff.lint]
# Explicit set: keep CI stable on ruff==0.16.1. Skip noisy families
# (S, SIM, PERF, PT, FAST, ARG, E501) — format owns wrapping.
select = [
  "E4", "E7", "E9", "F",
  "W",
  "I",
  "UP",
  "B",
  "BLE",
  "C4",
  "PIE",
  "ASYNC",
  "RUF",
]
ignore = [
  "RUF001",  # × − in benches / German copy
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["gnom_hub"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "BLE001", "EXE001"]
"plugins/*" = ["BLE001"]
"tests/*" = ["BLE001", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.mutmut]
# =============================================================================
# mutmut deep config (Gnom-Hub)
# Fast CI path stays: python scripts/mutation_check.py
# Deep path:         ./scripts/run_mutmut.sh [profile]
# =============================================================================

# Default mutate target: pure Flex/clarify helpers (high signal).
# Profiles in scripts/run_mutmut.sh can widen this (flex|memory|wide).
paths_to_mutate = "src/gnom_hub/agents/roles_helpers.py"

# Never mutate tests, vendor, generated UI bundles, or data.
paths_to_exclude = "tests/,src/gnom_hub/ui/,data/,.venv/,venv/,dist/,build/"

# Pytest runner:
#  - PYTHONPATH=src  → src-layout package
#  - --assert=plain  → required by mutmut's pytest integration
#  - -x             → fail-fast (mutant killed ASAP)
#  - focused suite   → only contracts that assert helper behavior
runner = "env PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python -m pytest -x -q --tb=line --assert=plain -p no:cacheprovider tests/test_flex_wish_filter.py tests/test_needs_clarify.py tests/test_flex_pipeline.py tests/test_warm.py tests/test_warm_trim.py tests/test_vector_bm25.py"

tests_dir = "tests/"

# Timeout = baseline * multiplier + base  (infinite-loop protection)
test_time_multiplier = 2.5
test_time_base = 1.0

# Operators: keep logic/control/string (regex & keywords in clarify matter).
# Drop decorator / annassign / lambdef / fstring noise for this module.
enable_mutation_types = "operator,keyword,number,name,string,or_test,and_test,argument,expr_stmt"

# Optional hooks (restore path hygiene around each mutant)
pre_mutation = "python scripts/mutmut_hooks.py pre"
post_mutation = "python scripts/mutmut_hooks.py post"

# CI-friendly console
simple_output = true
no_progress = true
swallow_output = true

# dict-like names (if any TypedDict-style helpers appear later)
dict_synonyms = "Struct, NamedStruct, TypedDict"
