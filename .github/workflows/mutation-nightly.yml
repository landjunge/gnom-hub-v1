name: Mutation Nightly

# Deep-ish mutation + rank-eval; PR CI stays on fast pytest only.
on:
  schedule:
    # 03:17 UTC daily
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  mutation-and-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mut-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-mut-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install 'mutmut==2.4.5' toml

      - name: Fast mutation check (must kill all)
        run: |
          export PYTHONPATH=src
          python scripts/mutation_check.py

      - name: Vector rank-eval
        run: |
          export PYTHONPATH=src
          python scripts/vector_rank_eval.py

      - name: mutmut core profile (CI soft — report survivors)
        # --CI: exit 0 unless fatal; survivors still visible in log
        env:
          MUTMUT_HOOK_QUIET: "1"
          PYTHONPATH: src
        run: |
          ./scripts/run_mutmut.sh core || true
          mutmut results || true

      - name: Pytest mutation + rank regression
        run: |
          export PYTHONPATH=src
          pytest tests/test_mutation_helpers.py tests/test_mutmut_hooks.py tests/test_vector_rank_eval.py tests/test_vector_bm25.py -q --tb=short
