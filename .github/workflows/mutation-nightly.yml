name: Mutation Nightly

# Deep mutation + rank-eval; PR CI stays on fast pytest only.
on:
  schedule:
    # 03:17 UTC daily
    - cron: "17 3 * * *"
  workflow_dispatch:

# Never run two mutation jobs at once (schedule + manual, or overlapping days).
concurrency:
  group: mutation-nightly
  cancel-in-progress: false

jobs:
  mutation-and-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install 'mutmut==2.4.5' toml

      - name: Fast mutation check (must kill all)
        env:
          PYTHONPATH: src
        run: python scripts/mutation_check.py

      - name: Vector rank-eval
        env:
          PYTHONPATH: src
        run: python scripts/vector_rank_eval.py

      - name: mutmut core profile (CI soft — report survivors)
        env:
          MUTMUT_HOOK_QUIET: "1"
          PYTHONPATH: src
        run: |
          ./scripts/run_mutmut.sh core || true
          mutmut results || true

      - name: Pytest mutation + rank regression
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_mutation_helpers.py \
            tests/test_mutmut_hooks.py \
            tests/test_vector_rank_eval.py \
            tests/test_vector_bm25.py -q --tb=short

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Mutation nightly"
            echo ""
            echo "- mutation_check.py · vector_rank_eval · mutmut core (soft)"
          } >> "$GITHUB_STEP_SUMMARY"

