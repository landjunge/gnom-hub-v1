name: Mutation Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: mutation-nightly
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  CACHE_SEED: v2

jobs:
  mutation-and-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-${{ env.CACHE_SEED }}-venv-mut-py3.12-${{ hashFiles('pyproject.toml', 'requirements/ci-dev.txt') }}

      - name: Cache pip downloads
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-mut-py3.12-${{ hashFiles('pyproject.toml', 'requirements/ci-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-mut-py3.12-
            ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-py3.12-
            ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-

      - name: Create venv + install
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --prefer-binary -e ".[dev]"
          .venv/bin/pip install --prefer-binary 'mutmut==2.4.5' toml

      - name: Refresh editable on cache hit
        if: steps.cache-venv.outputs.cache-hit == 'true'
        run: |
          .venv/bin/pip install --prefer-binary --no-deps -e .
          .venv/bin/pip install --prefer-binary 'mutmut==2.4.5' toml

      - name: Fast mutation check (must kill all)
        env:
          PYTHONPATH: src
        run: .venv/bin/python scripts/mutation_check.py

      - name: Vector rank-eval
        env:
          PYTHONPATH: src
        run: .venv/bin/python scripts/vector_rank_eval.py

      - name: mutmut core profile (CI soft — report survivors)
        env:
          MUTMUT_HOOK_QUIET: "1"
          PYTHONPATH: src
          PATH: ${{ github.workspace }}/.venv/bin:${{ env.PATH }}
        run: |
          ./scripts/run_mutmut.sh core || true
          mutmut results || true

      - name: Pytest mutation + rank regression
        env:
          PYTHONPATH: src
        run: |
          .venv/bin/pytest tests/test_mutation_helpers.py \
            tests/test_mutmut_hooks.py \
            tests/test_vector_rank_eval.py \
            tests/test_vector_bm25.py -q --tb=short

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Mutation nightly"
            echo ""
            echo "- venv cache hit: \`${{ steps.cache-venv.outputs.cache-hit }}\`"
            echo "- seed: \`$CACHE_SEED\`"
          } >> "$GITHUB_STEP_SUMMARY"
