name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  # Bump to globally invalidate venv/pip caches after strategy changes.
  CACHE_SEED: v3

jobs:
  # No full app install. Ruff via official action (binary); mermaid is stdlib.
  lint:
    name: Lint · Ruff · Mermaid · ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 (mermaid only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No pip cache — lint does not pip-install the app.

      - name: Ruff (binary action, no pip)
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
          args: "check ."

      - name: Ruff format --check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
          args: "format --check ."

      - name: Mermaid check + inventory drift
        env:
          PYTHONPATH: src
        run: |
          chmod +x scripts/mermaid_check.py
          python scripts/mermaid_check.py --list
          python scripts/mermaid_check.py --write-inventory docs/generated/mermaid_inventory.md
          if ! git diff --exit-code -- docs/generated/mermaid_inventory.md; then
            echo "::error::mermaid_inventory.md out of date — run locally:"
            echo "  python scripts/mermaid_check.py --write-inventory docs/generated/mermaid_inventory.md"
            echo "  git add docs/generated/mermaid_inventory.md && git commit"
            exit 1
          fi
          echo "▸ docs index check"
          python scripts/build_docs_index.py --check

      - name: Set up Node 22 (ESLint UI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: ESLint (app.js, max-warnings 0)
        run: |
          npm ci
          npm run lint:js
          npm run lint:js:specificity

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Lint summary"
            echo ""
            echo "- Ruff: \`astral-sh/ruff-action@v3\` pin **0.16.1** (no pip install)"
            echo "- Mermaid: stdlib script · inventory drift gate"
            echo "- ESLint: \`npm run lint:js\` (max-warnings 0) + specificity self-test"
            echo "- Pip cache: **none** (by design — keeps lint cold-start ~seconds)"
            echo ""
            python scripts/mermaid_check.py --json 2>/dev/null | python -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print(f\"- Blocks: **{d['blocks']}** · files {d['files']} · err {d['errors']} · warn {d['warnings']}\")
          except Exception as e:
            print(f\"- (summary skip: {e})\")
          " || true
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test · Py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - python-version: "3.12"
            run_smoke: true
            run_live: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-py
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Explicit actions/cache below (venv + pip download) — avoid double pip cache.

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          # Exact key only — never partial restore (ABI / dep skew risk).
          key: ${{ runner.os }}-${{ env.CACHE_SEED }}-venv-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/ci-dev.txt') }}

      - name: Verify cached venv (cache hit)
        if: steps.cache-venv.outputs.cache-hit == 'true'
        id: verify-venv
        run: |
          set -euo pipefail
          if [ ! -x .venv/bin/python ]; then
            echo "broken=true" >> "$GITHUB_OUTPUT"
            echo "::warning::venv cache hit but .venv/bin/python missing — reinstalling"
            rm -rf .venv
            exit 0
          fi
          echo "broken=false" >> "$GITHUB_OUTPUT"
          .venv/bin/python -c "import gnom_hub,pytest; print('venv cache hit ok', gnom_hub.__version__)"
          # Editable install may point at old path — re-link cheaply without resolving deps.
          .venv/bin/pip install --prefer-binary --no-deps -e . >/dev/null

      - name: Cache pip downloads
        id: cache-pip
        if: steps.cache-venv.outputs.cache-hit != 'true' || steps.verify-venv.outputs.broken == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/ci-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-py${{ matrix.python-version }}-
            ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-

      - name: Create venv + install (cache miss or broken)
        if: steps.cache-venv.outputs.cache-hit != 'true' || steps.verify-venv.outputs.broken == 'true'
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install --prefer-binary --upgrade-strategy only-if-needed -e ".[dev]"
          .venv/bin/python -c "import gnom_hub,pytest,ruff; print('install ok', gnom_hub.__version__)"

      - name: Pytest
        env:
          PYTEST_ADDOPTS: "-q --tb=short"
          PYTHONPATH: src
        run: |
          export TMPDIR="${RUNNER_TEMP}/pytest-${{ matrix.python-version }}"
          mkdir -p "$TMPDIR"
          .venv/bin/pytest tests/ --junitxml="$TMPDIR/junit.xml"

      - name: Smoke E2E (in-process, Py3.12 only)
        if: ${{ matrix.run_smoke }}
        env:
          PYTHONPATH: src
        run: .venv/bin/python scripts/smoke_e2e.py

      - name: Live DeepSeek smoke (optional, Py3.12 only)
        if: ${{ matrix.run_live }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: src
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "SKIP live smoke — no DEEPSEEK_API_KEY secret"
            exit 0
          fi
          .venv/bin/python scripts/smoke_live.py || echo "LIVE smoke non-blocking failure"

      - name: Upload junit (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-${{ matrix.python-version }}/junit.xml
          if-no-files-found: ignore
          retention-days: 5

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Test Py${{ matrix.python-version }}"
            echo ""
            echo "| Cache | Hit |"
            echo "|-------|-----|"
            echo "| venv (\`.venv\`) | \`${{ steps.cache-venv.outputs.cache-hit }}\` |"
            echo "| pip downloads | \`${{ steps.cache-pip.outputs.cache-hit || 'skipped' }}\` |"
            echo ""
            echo "- key seed: \`$CACHE_SEED\` · smoke: ${{ matrix.run_smoke }} · live: ${{ matrix.run_live }}"
            echo "- see docs/PYTHON_CACHE.md"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    name: CI OK
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require lint + test green
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"

      - name: Gate summary
        if: always()
        run: |
          {
            echo "## CI gate"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| lint | \`${{ needs.lint.result }}\` |"
            echo "| test | \`${{ needs.test.result }}\` |"
            echo ""
            echo "Lint: ruff-action (no pip) ∥ test: venv+pipdl caches · smoke only 3.12"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release & Publish Package
    needs: ci-ok
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20

    permissions:
      contents: write
      packages: write

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip (build tools)
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-release-py3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-release-py3.11-
            ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary build twine

      - name: Build Python package
        run: python -m build

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          twine upload --repository-url https://upload.pypi.org/legacy/ dist/* || true
          echo "Python package built. GitHub Packages ready when package structure is complete."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            dist/*
          body: |
            ### Changelog

            Auto-generated from commits and pull requests.

            ---

            ### Packages

            - Python package built and attached as release artifact
