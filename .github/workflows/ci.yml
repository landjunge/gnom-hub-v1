name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Fast path: Ruff + Mermaid only (no full app install).
  # Runs in parallel with test — wall-clock = max(lint, test), not sum.
  lint:
    name: Lint · Ruff · Mermaid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tools only
        run: |
          python -m pip install --upgrade pip
          # Match pin in pyproject.toml [project.optional-dependencies] dev
          pip install "ruff==0.16.1"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mermaid check + inventory drift
        env:
          PYTHONPATH: src
        run: |
          chmod +x scripts/mermaid_check.py
          python scripts/mermaid_check.py --list
          python scripts/mermaid_check.py --write-inventory docs/generated/mermaid_inventory.md
          if ! git diff --exit-code -- docs/generated/mermaid_inventory.md; then
            echo "::error::mermaid_inventory.md out of date — run locally:"
            echo "  python scripts/mermaid_check.py --write-inventory docs/generated/mermaid_inventory.md"
            echo "  git add docs/generated/mermaid_inventory.md && git commit"
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Lint summary"
            echo ""
            echo "- Ruff 0.16.1 (no full \`pip install -e\`)"
            echo "- Mermaid static check + inventory drift"
            echo ""
            python scripts/mermaid_check.py --json 2>/dev/null | python -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print(f\"- Blocks: **{d['blocks']}** · files {d['files']} · err {d['errors']} · warn {d['warnings']}\")
          except Exception as e:
            print(f\"- (summary skip: {e})\")
          " || true
          } >> "$GITHUB_STEP_SUMMARY"

  # Matrix: full install + pytest. Parallel with lint.
  test:
    name: Test · Py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # Extra flags only on 3.12 (merged into that cell).
        include:
          - python-version: "3.12"
            run_smoke: true
            run_live: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev
        run: |
          python -m pip install --upgrade pip
          # No `build` here — only release needs it.
          pip install -e ".[dev]"

      - name: Pytest
        env:
          PYTEST_ADDOPTS: "-q --tb=short"
          PYTHONPATH: src
        run: |
          export TMPDIR="${RUNNER_TEMP}/pytest-${{ matrix.python-version }}"
          mkdir -p "$TMPDIR"
          pytest tests/ --junitxml="$TMPDIR/junit.xml"

      - name: Smoke E2E (in-process, Py3.12 only)
        if: ${{ matrix.run_smoke }}
        env:
          PYTHONPATH: src
        run: python scripts/smoke_e2e.py

      - name: Live DeepSeek smoke (optional, Py3.12 only)
        if: ${{ matrix.run_live }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: src
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "SKIP live smoke — no DEEPSEEK_API_KEY secret"
            exit 0
          fi
          python scripts/smoke_live.py || echo "LIVE smoke non-blocking failure"

      - name: Upload junit (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-${{ matrix.python-version }}/junit.xml
          if-no-files-found: ignore
          retention-days: 5

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Test Py${{ matrix.python-version }}"
            echo ""
            echo "- pytest: always"
            echo "- smoke_e2e: ${{ matrix.run_smoke }}"
            echo "- live smoke: ${{ matrix.run_live }}"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    name: CI OK
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require lint + test green
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"

      - name: Gate summary
        if: always()
        run: |
          {
            echo "## CI gate"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| lint | \`${{ needs.lint.result }}\` |"
            echo "| test | \`${{ needs.test.result }}\` |"
            echo ""
            echo "Lint ∥ test (parallel). Smoke/live only on 3.12."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release & Publish Package
    needs: ci-ok
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20

    permissions:
      contents: write
      packages: write

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Build Python package
        run: python -m build

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          twine upload --repository-url https://upload.pypi.org/legacy/ dist/* || true
          echo "Python package built. GitHub Packages ready when package structure is complete."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            dist/*
          body: |
            ### Changelog

            Auto-generated from commits and pull requests.

            ---

            ### Packages

            - Python package built and attached as release artifact
