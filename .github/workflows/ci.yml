name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# One active run per ref: new commits cancel outdated matrix runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Mirrors local ./scripts/prepush_gate.sh (Ruff + Mermaid).
  lint:
    name: Lint · Ruff · Mermaid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pre-push gate (Ruff + Mermaid)
        env:
          # Match AGENTS.md / local hooks; pytest stays in matrix job.
          GNOM_PREPUSH_MERMAID: "1"
          GNOM_PREPUSH_PYTEST: "0"
        run: |
          chmod +x scripts/prepush_gate.sh scripts/mermaid_check.py
          ./scripts/prepush_gate.sh

      - name: Mermaid inventory drift
        env:
          PYTHONPATH: src
        run: |
          python scripts/mermaid_check.py --list
          python scripts/mermaid_check.py --write-inventory docs/generated/mermaid_inventory.md
          if ! git diff --exit-code -- docs/generated/mermaid_inventory.md; then
            echo "::error::mermaid_inventory.md out of date — run:"
            echo "  python scripts/mermaid_check.py --write-inventory docs/generated/mermaid_inventory.md"
            echo "  git add docs/generated/mermaid_inventory.md && git commit"
            exit 1
          fi

      - name: Job summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          {
            echo "## Lint summary"
            echo ""
            echo "- Ruff + Mermaid: prepush_gate.sh"
            echo "- Inventory: \`docs/generated/mermaid_inventory.md\`"
            echo ""
            python scripts/mermaid_check.py --json | python -c "
          import json,sys
          d=json.load(sys.stdin)
          print(f\"- Mermaid blocks: **{d['blocks']}** in {d['files']} files\")
          print(f\"- Errors: {d['errors']} · Warnings: {d['warnings']}\")
          "
          } >> "$GITHUB_STEP_SUMMARY"

  # Matrix tests: isolated caches per Python version.
  test:
    name: Test · Py${{ matrix.python-version }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Pytest
        env:
          PYTEST_ADDOPTS: "-q --tb=short"
          PYTHONPATH: src
        run: |
          if [ -d "tests" ]; then
            export TMPDIR="${RUNNER_TEMP}/pytest-${{ matrix.python-version }}"
            mkdir -p "$TMPDIR"
            pytest tests/ \
              --junitxml="$TMPDIR/junit.xml"
          else
            echo "No tests directory — skip"
          fi

      - name: Smoke E2E (in-process)
        env:
          PYTHONPATH: src
        run: python scripts/smoke_e2e.py

      - name: Live DeepSeek smoke (optional)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: src
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "SKIP live smoke — no DEEPSEEK_API_KEY secret"
            exit 0
          fi
          python scripts/smoke_live.py || echo "LIVE smoke non-blocking failure"

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-${{ matrix.python-version }}/junit.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Test Py${{ matrix.python-version }}"
            echo ""
            echo "- Pytest + smoke_e2e completed (see logs if red)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Single gate for branch protection / release.
  ci-ok:
    name: CI OK
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require lint + all matrix cells green
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"

      - name: Gate summary
        if: always()
        run: |
          {
            echo "## CI gate"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| lint | \`${{ needs.lint.result }}\` |"
            echo "| test | \`${{ needs.test.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release & Publish Package
    needs: ci-ok
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20

    permissions:
      contents: write
      packages: write

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Build Python package
        run: python -m build

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          twine upload --repository-url https://upload.pypi.org/legacy/ dist/* || true
          echo "Python package built. GitHub Packages ready when package structure is complete."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            dist/*
          body: |
            ### Changelog

            Auto-generated from commits and pull requests.

            ---

            ### Packages

            - Python package built and attached as release artifact
