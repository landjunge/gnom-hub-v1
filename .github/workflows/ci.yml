name: CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

# One active run per ref: new commits cancel outdated matrix runs (avoids
# stacked PR/main CI fighting the same runners/caches).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint once — not 3× in the matrix (faster, no parallel format races).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  # Matrix tests: isolated caches per Python version (no shared pip-cache race).
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # setup-python cache is version-scoped — safe under parallel matrix.
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Pytest
        env:
          # Isolate pytest temp / cache per matrix cell if jobs share a runner disk.
          PYTEST_ADDOPTS: "-q --tb=short"
          PYTHONPATH: src
        run: |
          if [ -d "tests" ]; then
            # Unique junit/tmp per matrix to avoid parallel artifact clobber.
            export TMPDIR="${RUNNER_TEMP}/pytest-${{ matrix.python-version }}"
            mkdir -p "$TMPDIR"
            pytest tests/ \
              --junitxml="$TMPDIR/junit.xml"
          else
            echo "No tests directory — skip"
          fi

      - name: Smoke E2E (in-process)
        env:
          PYTHONPATH: src
        run: python scripts/smoke_e2e.py

      - name: Live DeepSeek smoke (optional)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: src
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "SKIP live smoke — no DEEPSEEK_API_KEY secret"
            exit 0
          fi
          python scripts/smoke_live.py || echo "LIVE smoke non-blocking failure"

      - name: Upload junit (debug flaky matrix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-${{ matrix.python-version }}/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # Single gate for branch protection / release (avoids "3 statuses" race).
  ci-ok:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require lint + all matrix cells green
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"

  release:
    name: Create GitHub Release & Publish Package
    needs: ci-ok
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      packages: write

    # Tags must not race each other.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Build Python package
        run: python -m build

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          twine upload --repository-url https://upload.pypi.org/legacy/ dist/* || true
          echo "Python package built. GitHub Packages ready when package structure is complete."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            dist/*
          body: |
            ### Changelog

            Auto-generated from commits and pull requests.

            ---

            ### Packages

            - Python package built and attached as release artifact
