name: CI/CD

on:
  push:
    branches: [main, master, baseline]
    tags:
      - "v*"
  pull_request:
    branches: [main, master, baseline]
  schedule:
    - cron: "12 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  CACHE_SEED: v3

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
          args: "check ."
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
          args: "format --check --diff ."
      - name: Mermaid + docs index
        env:
          PYTHONPATH: src
        run: |
          chmod +x scripts/mermaid_check.py
          python scripts/mermaid_check.py --list
          python scripts/mermaid_check.py --write-inventory docs/generated/mermaid_inventory.md
          git diff --exit-code -- docs/generated/mermaid_inventory.md
          python scripts/build_docs_index.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: ESLint
        run: |
          npm ci
          npm run lint:js
          npm run lint:js:specificity

  test:
    name: Test Py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - python-version: "3.12"
            run_smoke: true
            run_live: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-${{ env.CACHE_SEED }}-venv-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/ci-dev.txt') }}
      - name: Verify cached venv
        if: steps.cache-venv.outputs.cache-hit == 'true'
        id: verify-venv
        run: |
          set -euo pipefail
          if [ ! -x .venv/bin/python ]; then
            echo "broken=true" >> "$GITHUB_OUTPUT"
            rm -rf .venv
            exit 0
          fi
          echo "broken=false" >> "$GITHUB_OUTPUT"
          .venv/bin/python -c "import gnom_hub,pytest"
          .venv/bin/pip install --prefer-binary --no-deps -e . >/dev/null
      - name: Cache pip downloads
        if: steps.cache-venv.outputs.cache-hit != 'true' || steps.verify-venv.outputs.broken == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ env.CACHE_SEED }}-pipdl-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/ci-dev.txt') }}
      - name: Install
        if: steps.cache-venv.outputs.cache-hit != 'true' || steps.verify-venv.outputs.broken == 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install --prefer-binary --upgrade-strategy only-if-needed -e ".[dev]"
      - name: Pytest
        env:
          PYTEST_ADDOPTS: "-q --tb=short"
          PYTHONPATH: src
        run: |
          export TMPDIR="${RUNNER_TEMP}/pytest-${{ matrix.python-version }}"
          mkdir -p "$TMPDIR"
          .venv/bin/pytest tests/ --junitxml="$TMPDIR/junit.xml"
      - name: Smoke E2E
        if: ${{ matrix.run_smoke }}
        env:
          PYTHONPATH: src
        run: .venv/bin/python scripts/smoke_e2e.py
      - name: Live smoke
        if: ${{ matrix.run_live }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: src
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then echo SKIP; exit 0; fi
          .venv/bin/python scripts/smoke_live.py || echo "LIVE smoke non-blocking failure"

  ci-ok:
    name: CI OK
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require lint + test green
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
