name: pr109-apply-ui-gates

# One-shot helper: restore amputated 08 from baseline, apply toast/core gates, rebuild app.js.
# Triggers only when this workflow file is added. Deletes itself after a successful commit.
on:
  push:
    branches: [fix/pipeline-honesty-106]
    paths:
      - ".github/workflows/pr109-apply-ui-gates.yml"

permissions:
  contents: write

concurrency:
  group: pr109-apply-ui-gates
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pipeline-honesty-106
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore 08 from baseline, gate toasts + 00-core, rebuild app.js
        run: |
          set -euo pipefail
          git fetch origin baseline
          git checkout origin/baseline -- src/gnom_hub/ui/static/parts/08-chat-jobs.js
          python3 scripts/pr109_apply_ui_gates.py
          python3 scripts/build_ui_js.py
          python3 - <<'PY'
          from pathlib import Path
          src = Path("src/gnom_hub/ui/static/parts/08-chat-jobs.js").read_text(encoding="utf-8")
          assert "snap.pipeline.deliverable_ok" in src
          for toast in (
              'toast("Umgesetzt · Box 3", "ok")',
              'toast("Fertig · " + formatDuration(dur), "ok")',
              'toast(wid + " re-run done", "ok")',
              'toast("Nochmal fertig", "ok")',
          ):
              pos = src.find(toast)
              assert pos != -1, toast
              gate = src.rfind("okDeliverable", 0, pos)
              assert gate != -1 and pos - gate < 900, toast
          speech = Path("src/gnom_hub/ui/static/parts/02-speech.js").read_text(encoding="utf-8")
          assert "p.deliverable_ok === true" in speech
          core = Path("src/gnom_hub/ui/static/parts/00-core.js").read_text(encoding="utf-8")
          assert "pipe.deliverable_ok === true" in core
          assert 'result === "UNGEPRÜFT" || result)' not in core
          print("gates ok", Path("src/gnom_hub/ui/static/parts/08-chat-jobs.js").stat().st_size)
          PY
          git config user.email "155759754+landjunge@users.noreply.github.com"
          git config user.name "Daniel"
          git rm -f .github/workflows/pr109-apply-ui-gates.yml scripts/pr109_apply_ui_gates.py
          git add src/gnom_hub/ui/static/parts/00-core.js src/gnom_hub/ui/static/parts/08-chat-jobs.js src/gnom_hub/ui/static/app.js
          git commit -m "fix: gate UI success toasts on deliverable_ok (#106)"
          git push origin HEAD:fix/pipeline-honesty-106
