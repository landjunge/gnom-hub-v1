# Optimierte Konfiguration für automatische Release Notes / Changelog

changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
      - dependencies
    authors:
      - github-actions
      - dependabot

  categories:
    - title: "🆕 Neue Features"
      labels:
        - feature
        - enhancement
        - feat
      collapse-after: 8

    - title: "🐛 Bugfixes"
      labels:
        - bug
        - fix
        - bugfix
      collapse-after: 10

    - title: "⚡ Performance"
      labels:
        - performance
        - perf

    - title: "🔧 Verbesserungen"
      labels:
        - refactor
        - improvement
        - chore
        - cleanup

    - title: "📚 Dokumentation"
      labels:
        - documentation
        - docs

    - title: "🔒 Sicherheit"
      labels:
        - security

    - title: "📦 Infrastruktur & CI"
      labels:
        - ci
        - infrastructure
        - build

    - title: "Andere Änderungen"
      labels:
        - "*"
